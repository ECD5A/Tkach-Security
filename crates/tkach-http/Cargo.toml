[package]
name = "tkach-http"
version = "0.1.0"
description = "Loopback-only HTTP adapter for the Tkach Security runtime boundary"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tkach-core = { path = "../tkach-core", version = "0.1.0" }
tkach-gateway = { path = "../tkach-gateway", version = "0.1.0" }

[lints]
workspace = true
