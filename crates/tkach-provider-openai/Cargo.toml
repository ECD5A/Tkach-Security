[package]
name = "tkach-provider-openai"
version = "0.1.0"
description = "OpenAI Responses API adapter for the Tkach Security provider boundary"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
fuzzing = []

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dependencies.tkach-gateway]
package = "tkach-gateway"
path = "../tkach-gateway"
version = "0.1.0"

[dependencies.tkach-core]
package = "tkach-core"
path = "../tkach-core"
version = "0.1.0"

[lints]
workspace = true
