[package]
name = "tkach-mcp"
version = "0.1.1"
description = "Bounded MCP stdio adapter for the Tkach Security local runtime"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tkach-client = { path = "../tkach-client", version = "0.1.1" }

[dev-dependencies]
tkach-core = { path = "../tkach-core", version = "0.1.1" }
tkach-gateway = { path = "../tkach-gateway", version = "0.1.1" }
tkach-http = { path = "../tkach-http", version = "0.1.1" }

[lints]
workspace = true

[[bin]]
name = "tkach-mcp"
path = "src/main.rs"
