[package]
name = "tkach-cli"
version = "0.1.0"
description = "Small safe CLI onboarding adapter for Tkach Security"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
ctrlc = "3.4"
png = "0.18.1"
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm_0_29"] }
tkach-core = { path = "../tkach-core", version = "0.1.0" }
tkach-gateway = { path = "../tkach-gateway", version = "0.1.0" }
tkach-http = { path = "../tkach-http", version = "0.1.0" }
tkach-provider-openai = { path = "../tkach-provider-openai", version = "0.1.0" }

[lints]
workspace = true

[[bin]]
name = "tkach"
path = "src/main.rs"
