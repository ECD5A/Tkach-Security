[workspace]
resolver = "2"
members = [
    "crates/tkach-core",
    "crates/tkach-gateway",
    "crates/tkach-provider-openai",
    "crates/tkach-cli",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/ECD5A/Tkach-Security"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
