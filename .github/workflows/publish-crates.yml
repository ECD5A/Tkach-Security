name: Publish Rust crates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Verified release tag to publish (for example, v0.1.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the versioned Rust workspace
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: crates-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RUST_TOOLCHAIN: 1.85.1
    steps:
      - name: Check out the verified release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --no-self-update

      - name: Verify tag and shared version contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected="${RELEASE_TAG#v}"
          actual="$(cargo +"${RUST_TOOLCHAIN}" pkgid -p tkach-core | sed 's/.*#//')"
          test "${expected}" = "${actual}"
          python tools/release/check_versions.py

      - name: Package the root crate before authentication
        shell: bash
        run: |
          set -euo pipefail
          cargo +"${RUST_TOOLCHAIN}" package --package tkach-core --locked

      - name: Authenticate with crates.io Trusted Publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crates in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for crate in tkach-core tkach-gateway tkach-http tkach-client tkach-provider-openai tkach-mcp tkach-cli; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/${crate}/${version}")"
            case "${status}" in
              200)
                echo "${crate}@${version} already exists; skipping duplicate publish."
                ;;
              404)
                cargo +"${RUST_TOOLCHAIN}" package --package "${crate}" --locked
                cargo +"${RUST_TOOLCHAIN}" publish --package "${crate}" --locked
                for attempt in $(seq 1 24); do
                  status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/${crate}/${version}")"
                  [[ "${status}" = 200 ]] && break
                  [[ "${status}" = 404 ]] || { echo "unexpected crates.io status ${status}" >&2; exit 1; }
                  sleep 5
                done
                test "${status}" = 200
                ;;
              *)
                echo "crates.io lookup failed for ${crate}@${version}: HTTP ${status}" >&2
                exit 1
                ;;
            esac
          done
