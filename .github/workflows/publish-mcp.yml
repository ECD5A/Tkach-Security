name: Publish MCP Registry metadata

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published Git tag to register (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mcp-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish server.json to the Official MCP Registry
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: mcp-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - name: Check out the published tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Verify tag and shared version contract
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected="${TAG#v}"
          actual="$(python -c 'import tomllib; print(tomllib.load(open("crates/tkach-core/Cargo.toml", "rb"))["package"]["version"])')"
          test "${expected}" = "${actual}"
          python tools/release/check_versions.py

      - name: Download the pinned official publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/mcp-publisher_linux_amd64.tar.gz"
          url="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "${archive}" "${url}"
          printf '%s  %s\n' "${MCP_PUBLISHER_SHA256}" "${archive}" | sha256sum --check --status
          mkdir -p "${RUNNER_TEMP}/mcp-publisher"
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}/mcp-publisher" \
            --no-same-owner mcp-publisher
          chmod 0755 "${RUNNER_TEMP}/mcp-publisher/mcp-publisher"

      - name: Validate server.json with the official publisher
        run: |
          "${RUNNER_TEMP}/mcp-publisher/mcp-publisher" validate server.json

      - name: Authenticate with GitHub OIDC
        run: |
          "${RUNNER_TEMP}/mcp-publisher/mcp-publisher" login github-oidc

      - name: Publish server metadata
        run: |
          "${RUNNER_TEMP}/mcp-publisher/mcp-publisher" publish server.json
