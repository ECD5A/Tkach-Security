name: Publish npm package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish JavaScript adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/javascript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install pinned npm CLI
        run: npm install --global npm@11.19.1 --ignore-scripts
      - name: Verify tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          actual="$(node -p "require('./package.json').version")"
          test "${TAG}" = "v${actual}"
          test "${expected}" = "${actual}"
      - name: Test package
        run: npm test
      - name: Inspect package contents
        run: npm pack --dry-run --ignore-scripts
      - name: Check whether the version is already published
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          lookup_error="$(mktemp)"
          if npm view "${package_name}@${package_version}" version --json \
              --registry=https://registry.npmjs.org >/dev/null 2>"${lookup_error}"; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "${package_name}@${package_version} already exists; no duplicate publish will be attempted."
          elif npm ping --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "${package_name}@${package_version} is not present; publish is eligible."
          else
            echo "npm registry lookup failed; refusing to publish without a reliable duplicate check." >&2
            cat "${lookup_error}" >&2
            exit 1
          fi
          rm -f -- "${lookup_error}"
      - name: Publish package with npm OIDC
        if: steps.registry.outputs.exists != 'true'
        run: npm publish --provenance --access public --ignore-scripts --registry=https://registry.npmjs.org
