name: Stage npm package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    name: Stage JavaScript adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/javascript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm staged-publishing CLI
        run: npm install --global npm@11.19.1 --ignore-scripts
      - name: Verify tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          actual="$(node -p "require('./package.json').version")"
          test "${TAG}" = "v${actual}"
          test "${expected}" = "${actual}"
      - name: Test package
        run: npm test
      - name: Inspect package contents
        run: npm pack --dry-run --ignore-scripts
      - name: Stage package for maintainer approval
        run: npm stage publish
