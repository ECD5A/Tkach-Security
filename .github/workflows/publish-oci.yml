name: Publish OCI image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published Git tag to package (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oci-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish signed GHCR image
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/ecd5a/tkach-security
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the published tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Verify tag and shared version contract
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected="${TAG#v}"
          actual="$(python -c 'import tomllib; print(tomllib.load(open("crates/tkach-core/Cargo.toml", "rb"))["package"]["version"])')"
          test "${expected}" = "${actual}"
          python tools/release/check_versions.py

      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for the supported Linux architectures
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push immutable versioned image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Attach signed GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Confirm the pushed multi-arch digest
        shell: bash
        run: docker buildx imagetools inspect "${IMAGE}@${{ steps.push.outputs.digest }}"
