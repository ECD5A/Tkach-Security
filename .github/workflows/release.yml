name: Release artifacts

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.85.1
  CARGO_TERM_COLOR: never

jobs:
  verify:
    name: Verify release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --no-self-update
      - name: Install pinned rustfmt component
        run: rustup component add rustfmt --toolchain "${RUST_TOOLCHAIN}"
      - name: Install pinned clippy component
        run: rustup component add clippy --toolchain "${RUST_TOOLCHAIN}"
      - name: Validate SemVer tag against the Core package
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected="${TAG#v}"
          actual="$(cargo +"${RUST_TOOLCHAIN}" pkgid -p tkach-core | sed 's/.*#//')"
          test "${expected}" = "${actual}"
      - run: cargo +${RUST_TOOLCHAIN} fmt --all -- --check
      - run: cargo +${RUST_TOOLCHAIN} metadata --format-version=1 --locked --no-deps
      - run: cargo +${RUST_TOOLCHAIN} clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +${RUST_TOOLCHAIN} test --workspace --all-targets --all-features --locked
      - run: cargo +${RUST_TOOLCHAIN} test --workspace --release --all-targets --all-features --locked
      - run: cargo +${RUST_TOOLCHAIN} test --workspace --doc --all-features --locked
      - name: Build documentation with warnings denied
        run: RUSTDOCFLAGS="-D warnings" cargo +${RUST_TOOLCHAIN} doc --workspace --all-features --no-deps --locked
      - name: Install pinned dependency audit tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit
      - run: cargo deny check
      - name: Verify shared package version contract
        run: python tools/release/check_versions.py
      - run: cargo +${RUST_TOOLCHAIN} check --manifest-path fuzz/Cargo.toml --bins --locked
      - name: Package the registry-independent Core crate
        run: cargo +${RUST_TOOLCHAIN} package -p tkach-core --locked
      - run: cargo +${RUST_TOOLCHAIN} run -p tkach-gateway --example quickstart --locked
      - run: cargo +${RUST_TOOLCHAIN} run -p tkach-gateway --example golden_case --locked
      - name: Test deterministic release packaging
        run: python -m unittest discover -s tools/release -p "test_*.py" -v
      - name: Smoke fresh CLI and MCP installs
        shell: bash
        run: |
          set -euo pipefail
          install_root="${RUNNER_TEMP}/tkach-install"
          cargo +${RUST_TOOLCHAIN} install --path crates/tkach-cli --locked --root "${install_root}/cli"
          cargo +${RUST_TOOLCHAIN} install --path crates/tkach-mcp --locked --root "${install_root}/mcp"
          "${install_root}/cli/bin/tkach" --version
          "${install_root}/mcp/bin/tkach-mcp" --version
          printf '' | TKACH_HTTP_ADDR=127.0.0.1:8080 TKACH_BEARER_TOKEN=release-smoke-token \
            "${install_root}/mcp/bin/tkach-mcp"
      - name: Test the Python adapter
        run: python -m unittest discover -s sdk/python -p "test_*.py" -v
      - name: Build the local Python package
        run: python -m pip wheel --no-deps sdk/python --wheel-dir "$RUNNER_TEMP/tkach-python-wheel"
      - name: Test the Node adapter
        run: node --test sdk/javascript/test_tkach_client.mjs
      - name: Validate the local Node package
        working-directory: sdk/javascript
        run: npm pack --dry-run --ignore-scripts
      - name: Test and vet the Go adapter
        working-directory: sdk/go
        run: |
          go test ./...
          go vet ./...
      - name: Compile the copyable examples
        run: |
          python -m py_compile examples/python/run.py
          node --check examples/javascript/run.mjs
      - name: Compile the Go example
        working-directory: examples/go
        run: go test ./...

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "${{ env.RUST_TOOLCHAIN }}" --profile minimal --no-self-update
      - name: Install target
        run: rustup target add --toolchain "${{ env.RUST_TOOLCHAIN }}" "${{ matrix.target }}"
      - name: Build release binaries
        run: cargo +${{ env.RUST_TOOLCHAIN }} build --locked --release --target "${{ matrix.target }}" -p tkach-cli -p tkach-mcp
      - name: Package Unix release assets
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          python3 tools/release/package_release.py \
            --version "${version}" \
            --target "${TARGET}" \
            --format tar.gz \
            --output-dir release \
            --source-date-epoch "${epoch}" \
            --binary "tkach=target/${TARGET}/release/tkach" \
            --binary "tkach-mcp=target/${TARGET}/release/tkach-mcp"
          name="tkach-${version}-${TARGET}"
          (cd release && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - name: Package Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION.Substring(1)
          $epochText = (git show -s --format=%cI $env:GITHUB_SHA).Trim()
          $epoch = [DateTimeOffset]::Parse($epochText).ToUnixTimeSeconds()
          python tools/release/package_release.py `
            --version $version `
            --target $env:TARGET `
            --format zip `
            --output-dir release `
            --source-date-epoch $epoch `
            --binary "tkach=target/$env:TARGET/release/tkach.exe" `
            --binary "tkach-mcp=target/$env:TARGET/release/tkach-mcp.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = "tkach-$version-$env:TARGET"
          $hash = (Get-FileHash "release/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $encoding = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("release/$name.zip.sha256", "$hash  $name.zip", $encoding)
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 7

  container:
    name: Build and smoke-test private OCI image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build local image without pulling mutable base updates
        env:
          IMAGE: tkach:${{ github.ref_name }}
        run: docker build --pull=false --tag "${IMAGE}" .
      - name: Run loopback-only container health smoke
        shell: bash
        env:
          IMAGE: tkach:${{ github.ref_name }}
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --network host \
            --env TKACH_BEARER_TOKEN=release-container-token \
            --env OPENAI_API_KEY=release-container-provider \
            --env TKACH_HTTP_ADDR=127.0.0.1:8080 \
            "${IMAGE}")"
          cleanup() {
            docker logs "${container_id}" || true
            docker rm --force "${container_id}" >/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if docker exec "${container_id}" tkach health; then
              exit 0
            fi
            sleep 1
          done
          echo "container health did not become ready" >&2
          exit 1

  draft-release:
    name: Create attested draft release
    needs: [build, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download platform assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find release-assets -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)"
          (cd release-assets && sha256sum -c ./*.sha256)
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad8 # v4.0.0
      - name: Sign release assets with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          for artifact in release-assets/*.tar.gz release-assets/*.zip release-assets/*.sha256; do
            cosign sign-blob --yes "${artifact}" \
              --bundle "${artifact}.sigstore.json"
          done
      - name: Verify release asset signatures
        shell: bash
        env:
          WORKFLOW_IDENTITY: https://github.com/ECD5A/Tkach-Security/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          for artifact in release-assets/*.tar.gz release-assets/*.zip release-assets/*.sha256; do
            cosign verify-blob "${artifact}" \
              --bundle "${artifact}.sigstore.json" \
              --certificate-identity "${WORKFLOW_IDENTITY}" \
              --certificate-oidc-issuer "${OIDC_ISSUER}"
          done
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Tkach Security ${GITHUB_REF_NAME}"
