name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --no-self-update
      - run: cargo +1.85.1 fmt --all -- --check
      - run: cargo +1.85.1 metadata --format-version=1 --locked --no-deps
      - run: cargo +1.85.1 clippy --all-targets --all-features -- -D warnings
      - run: cargo +1.85.1 test --workspace --all-targets --all-features --locked
      - run: cargo +1.85.1 test --workspace --release --all-targets --all-features --locked
      - run: cargo +1.85.1 test --workspace --doc --all-features --locked
      - name: Build documentation with warnings denied
        run: RUSTDOCFLAGS="-D warnings" cargo +1.85.1 doc --workspace --all-features --no-deps --locked
      - name: Install pinned dependency audit tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit
      - run: cargo deny check
      - run: cargo +1.85.1 package --workspace --allow-dirty --no-verify --locked
      - run: cargo +1.85.1 run -p tkach-gateway --example quickstart --locked

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --no-self-update
      - run: cargo +1.85.1 check --manifest-path fuzz/Cargo.toml --bins --locked
      - run: cargo +1.85.1 run --manifest-path fuzz/Cargo.toml --bin canonical_text --locked -- -runs=100
