name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.rst'
      - '**/*.adoc'
      - '**/*.txt'
      - 'docs/**'
      - 'LICENSE'
      - 'assets/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.rst'
      - '**/*.adoc'
      - '**/*.txt'
      - 'docs/**'
      - 'LICENSE'
      - 'assets/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --no-self-update
      - name: Install pinned rustfmt component
        run: rustup component add rustfmt --toolchain 1.85.1
      - name: Install pinned clippy component
        run: rustup component add clippy --toolchain 1.85.1
      - run: cargo +1.85.1 fmt --all -- --check
      - run: cargo +1.85.1 metadata --format-version=1 --locked --no-deps
      - run: cargo +1.85.1 clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.85.1 test --workspace --all-targets --all-features --locked
      - run: cargo +1.85.1 test --workspace --release --all-targets --all-features --locked
      - run: cargo +1.85.1 test --workspace --doc --all-features --locked
      - name: Build documentation with warnings denied
        run: RUSTDOCFLAGS="-D warnings" cargo +1.85.1 doc --workspace --all-features --no-deps --locked
      - name: Install pinned dependency audit tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit
      - run: cargo deny check
      - name: Verify shared package version contract
        run: python tools/release/check_versions.py
      - name: Verify shared SDK contract matrix
        run: python tools/release/check_sdk_contract.py
      - name: Package the registry-independent Core crate
        run: cargo +1.85.1 package -p tkach-core --locked
      - run: cargo +1.85.1 run -p tkach-gateway --example quickstart --locked
      - name: Capture bounded performance baseline
        run: cargo +1.85.1 run --release -p tkach-gateway --example performance_baseline --locked > "$RUNNER_TEMP/tkach-performance-baseline.txt"
      - name: Upload performance baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tkach-performance-baseline
          path: ${{ runner.temp }}/tkach-performance-baseline.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Test deterministic release packaging
        run: python -m unittest discover -s tools/release -p "test_*.py" -v
      - name: Test the standard-library Python adapter
        run: python -m unittest discover -s sdk/python -p "test_*.py" -v
      - name: Build the local Python package
        run: python -m pip wheel --no-deps sdk/python --wheel-dir "$RUNNER_TEMP/tkach-python-wheel"
      - name: Test the dependency-free Node adapter
        run: node --test sdk/javascript/test_tkach_client.mjs
      - name: Validate the local Node package
        working-directory: sdk/javascript
        run: npm pack --dry-run --ignore-scripts
      - name: Test the dependency-free Go adapter
        working-directory: sdk/go
        run: go test ./...
      - name: Vet the dependency-free Go adapter
        working-directory: sdk/go
        run: go vet ./...

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/fuzz/target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --no-self-update
      - name: Install pinned rustfmt component
        run: rustup component add rustfmt --toolchain 1.85.1
      - name: Build every fuzz target outside the execution budget
        run: cargo +1.85.1 build --manifest-path fuzz/Cargo.toml --bins --locked
      - name: Run every fuzz target with a bounded smoke budget
        id: fuzz
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          artifact_root="${RUNNER_TEMP}/tkach-fuzz-artifacts"
          mkdir -p "${artifact_root}"
          status=0
          for target in canonical_text domain_wire gateway_wire openai_response; do
            target_root="${artifact_root}/${target}"
            mkdir -p "${target_root}"
            echo "Running ${target} with 1000 iterations and a 90 second limit"
            timeout --signal=TERM --kill-after=5s 90s \
              "${CARGO_TARGET_DIR}/debug/${target}" \
              -runs=1000 -timeout=10 -rss_limit_mb=1024 -artifact_prefix="${target_root}/" \
              2>&1 | tee "${target_root}/run.log"
            target_status=${PIPESTATUS[0]}
            if [[ "${target_status}" -ne 0 ]]; then
              echo "${target} failed with status ${target_status}" >&2
              status="${target_status}"
            fi
          done
          exit "${status}"
      - name: Upload fuzz logs and failure inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tkach-fuzz-artifacts
          path: ${{ runner.temp }}/tkach-fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail when a fuzz target failed or timed out
        if: steps.fuzz.outcome != 'success'
        run: exit 1

  platform:
    name: Platform compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --no-self-update
      - name: Install pinned rustfmt component
        run: rustup component add rustfmt --toolchain 1.85.1
      - name: Compile the complete workspace
        run: cargo +1.85.1 build --workspace --all-features --locked
      - name: Run the complete workspace test suite
        run: cargo +1.85.1 test --workspace --all-targets --all-features --locked
      - name: Execute the protected-effect Golden Case
        run: cargo +1.85.1 run -p tkach-gateway --example golden_case --locked
